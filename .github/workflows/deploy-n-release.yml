name: Deploy and Release

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    concurrency: ci-${{ github.ref }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Increment version
        id: increment-version
        uses: RichardInnocent/semantic-versioning-maven@v0.1.0

      # Only proceed if a new version was actually generated
      - name: Build and Package
        if: steps.increment-version.outputs.previous-version != steps.increment-version.outputs.new-version
        run: mvn clean package

      - name: Create GitHub Release
        if: steps.increment-version.outputs.previous-version != steps.increment-version.outputs.new-version
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.increment-version.outputs.new-version }}
          name: Release ${{ steps.increment-version.outputs.new-version }}
     
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
